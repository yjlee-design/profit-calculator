# 클라우드에서는 포트를 서버가 배정하므로 [server] 설정을 두지 않는다.
# 내 PC 에서 쓰는 포트는 launch_web.py 가 실행할 때 직접 넘긴다.

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#6366F1"
borderColor = "#E2E8F0"
baseRadius = "12px"
font = "Pretendard, -apple-system, 'Malgun Gothic', sans-serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"
borderColor = "#E2E8F0"
